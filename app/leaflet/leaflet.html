<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte des transactions agricoles - Leaflet</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/leaflet/styles/map_leaflet.css" />
  <link rel="stylesheet" href="/leaflet/styles/popup.css" />
  <link rel="stylesheet" href="/leaflet/styles/legend.css" />
  <link rel="stylesheet" href="/leaflet/styles/fond.css" />
  <link rel="stylesheet" href="/leaflet/styles/filters.css" />
</head>

<body>
  <div class="top-bar">
    <div id="top-left" class="top-content">
      <a class="home-link" href="../index.html" title="Retour a l'accueil">Accueil</a>
      <div class="header-separator"></div>
      <div class="header-title">Carte Leaflet</div>
    </div>
    <div id="top-right" class="top-content">
        <img class="partner-logo" src="../images/univlyon2_logo201806-N2.png" alt="logo1">
        <img class="partner-logo" src="../images/Univ-Lyon3_WEB.png" alt="logo2">
        <img class="partner-logo" src="../images/logo_ujm_noir.png" alt="logo3">
    </div>
  </div>
  
  <div class="app-container">
    <!-- ---------- MAIN CONTENT PANEL ----------- -->
    <div class="main-content">
      <div id="map"></div>

      <!-- Layer switcher button -->
      <div id="layer-switcher-btn" class="layer-switcher-btn">
        <img src="../images/layer.png" alt="Layers" title="Layer icons created by itim2101 - Flaticon" width="24" height="24">
      </div>
    </div>

    <!-- Layer Modal -->
    <div id="layer-modal" class="layer-modal">
      <div class="layer-modal-content">
        <span class="close-modal">&times;</span>
        <h3>Couche de base</h3>
        <div class="layer-options">
          <div class="layer-option active" data-layer="osm">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Openstreetmap_logo.svg" alt="OSM">
            <span>Standard</span>
          </div>
          <div class="layer-option" data-layer="satellite">
            <img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/0/0/0" alt="Satellite">
            <span>Satellite</span>
          </div>
          <div class="layer-option" data-layer="terrain">
            <img src="../images/terrain.png" alt="Terrain">
            <span>Terrain</span>
          </div>
        </div>
        <h3>Couches de contexte</h3>
        <div class="overlay-options">
          <label class="overlay-option">
            <input type="checkbox" data-overlay="pays" checked>
            <span>Pays</span>
          </label>
          <label class="overlay-option">
            <input type="checkbox" data-overlay="deals" checked>
            <span>Transactions agricoles</span>
          </label>
          <label class="overlay-option">
            <input type="checkbox" data-overlay="consulting-success" checked>
            <span>Consultation réussie (cabinet)</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Right Panel for Filters -->
    <div id="filter-panel" class="filter-panel">
      <div class="filter-panel-header">
        <h3>Filtres des transactions</h3>
      </div>
      
      <div class="filter-panel-content">
        <div class="filter-group">
          <label for="filter-community">Réaction de la communauté</label>
          <select id="filter-community">
            <option value="">-- Tous --</option>
            <option value="Consent">Acceptation</option>
            <option value="Rejection">Rejet</option>
            <option value="Mixed reaction">Neutre</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="filter-violence">Incidents de violence</label>
          <select id="filter-violence">
            <option value="">-- Tous --</option>
            <option value="false">Sans violence</option>
            <option value="true">Avec violence</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="filter-eviction">Expulsions</label>
          <select id="filter-eviction">
            <option value="">-- Tous --</option>
            <option value="false">Sans expulsion</option>
            <option value="true">Avec expulsion</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="filter-displacement">Déplacements</label>
          <select id="filter-displacement">
            <option value="">-- Tous --</option>
            <option value="false">Sans déplacement</option>
            <option value="true">Avec déplacement</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="filter-benefits">Avantages pour communautés</label>
          <select id="filter-benefits">
            <option value="">-- Tous --</option>
            <option value="true">Avec avantages</option>
            <option value="false">Sans avantages</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="filter-region">Région</label>
          <select id="filter-region">
            <option value="">-- Tous --</option>
            <option value="Africa">Afrique</option>
            <option value="Asia">Asie</option>
            <option value="Latin America">Amérique Latine</option>
            <option value="Europe">Europe</option>
          </select>
        </div>
        
        <button id="reset-filters" class="reset-btn">Réinitialiser filtres</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
